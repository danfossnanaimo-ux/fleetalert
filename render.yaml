services:
  - type: worker
    name: fleetalert-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      TELEGRAM_BOT_TOKEN:
        fromSecret: TELEGRAM_BOT_TOKEN
      GOOGLE_SERVICE_ACCOUNT_JSON:
        fromSecret: GOOGLE_SERVICE_ACCOUNT_JSON
      ROSTER_SHEET_ID:
        fromSecret: ROSTER_SHEET_ID
      FLEETALERT_TZ:
        fromSecret: FLEETALERT_TZ
