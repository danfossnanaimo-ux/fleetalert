name: FleetAlert Scheduler

on:
  schedule:
    # Every 5 minutes between 06:00–22:00 Pacific (adjust as needed)
    - cron: "*/5 13-05 * * *"
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FleetAlert scheduler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ROSTER_SHEET_ID: "1kAantOHhTF3D9iZPxn1gtxZ7QcCwoZyiTyjsSQMp8Bo"
          FLEETALERT_TZ: "America/Vancouver"
        run: |
          python scheduler.py
